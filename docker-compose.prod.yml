services:
  app:
    build: .
    image: yourname/comfortpay:latest
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # running in host network mode (network_mode: "host")
    # Note: service-level Docker DNS and service names are not available in host mode.
    # The nginx proxy should be configured to reach the app on the host (127.0.0.1:3000).

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
