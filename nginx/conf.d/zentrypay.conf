server {
  listen 80;
  server_name zentrypay.com www.zentrypay.com;

  # Redirect HTTP -> HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name zentrypay.com www.zentrypay.com;

  # Cloudflare Origin Certificate (place files at ./nginx/ssl/zentrypay.crt and zentrypay.key)
  ssl_certificate /etc/nginx/ssl/zentrypay.crt;
  ssl_certificate_key /etc/nginx/ssl/zentrypay.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers HIGH:!aNULL:!MD5;

  location / {
    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
