worker_processes 1;
events { worker_connections 1024; }
http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  upstream app_upstream {
    # app runs on the host network; use host.docker.internal to reach host loopback
    server host.docker.internal:3001;
  }
  # include per-site virtual host files. Place one file per site in ./nginx/conf.d/
  include /etc/nginx/conf.d/*.conf;
}
